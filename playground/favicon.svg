<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- a wolf's head, straight on: flat, two colours, square corners -->
  <rect width="100" height="100" fill="#161616"/>
  <!-- head with its ears -->
  <path fill="#e4e4e4" d="M16 10 L36 33 L64 33 L84 10 L80 50 L66 76 L50 88 L34 76 L20 50 Z"/>
  <!-- inner ears -->
  <path fill="#161616" d="M23 20 L32 34 L26 42 Z"/>
  <path fill="#161616" d="M77 20 L68 34 L74 42 Z"/>
  <!-- eyes, narrowed -->
  <path fill="#161616" d="M31 49 L43 52 L41 57 L29 54 Z"/>
  <path fill="#161616" d="M69 49 L57 52 L59 57 L71 54 Z"/>
  <!-- the muzzle's dark bridge and nose -->
  <path fill="#161616" d="M44 72 L56 72 L50 80 Z"/>
  <path fill="#161616" d="M47 63 L53 63 L50 69 Z"/>
</svg>
